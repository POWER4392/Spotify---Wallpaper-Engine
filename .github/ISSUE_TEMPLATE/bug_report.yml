name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in Wallpaper Engine for Spotify"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thank you for reporting an issue!
        Please fill in as much information as possible to help us reproduce and resolve the bug quickly.

  - type: textarea
    id: bug_description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "e.g., Background video fails to play when switching tracks, text clipping occurs..."
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: "Steps to Reproduce"
      description: "Steps to reproduce the behavior."
      placeholder: |
        1. Open Spotify with the extension loaded
        2. Set wallpaper mode to...
        3. Observe issue...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "System Environment"
      description: "Device and software configuration."
      value: |
        - OS: Windows 10 / 11 (64-bit)
        - Spotify Version: 
        - Spicetify Version: 
        - Screen Resolution & Aspect Ratio: 
        - Wallpaper Source: Wallpaper Engine / Custom Video (.webm)
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots / Media"
      description: "Drag & drop or paste (Ctrl + V) screenshots showing the issue."
      placeholder: "Paste screenshot here..."
    validations:
      required: false
